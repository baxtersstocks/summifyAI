<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SummifyAI — Paste Chaos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0b0b;
      color: #eaeaea;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9aa0a6;
      margin-bottom: 30px;
    }

    .card {
      background: #141414;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
    }

    button {
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      margin-right: 8px;
    }

    button:hover {
      background: #2c2c2c;
    }

    .primary {
      background: #22c55e;
      color: #000;
      font-weight: 600;
    }

    .primary:hover {
      background: #16a34a;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      background: #0f0f0f;
      color: #fff;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      resize: vertical;
    }

    .mode-btn {
      margin-bottom: 10px;
    }

    #output {
      white-space: pre-wrap;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #555;
      font-size: 13px;
      margin-top: 40px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Paste Chaos Here</h1>
    <div class="subtitle">
      Turn links, notes, tweets, screenshots, and mess into one clean page.
    </div>

    <div class="card">
      <h3>Inputs</h3>
      <button onclick="addInput()">+ Add Input</button>
      <button onclick="clearInputs()">Clear</button>
      <div id="inputs"></div>
    </div>

    <div class="card">
      <h3>Mode</h3>
      <button class="mode-btn" onclick="setMode('summary')">Summary</button>
      <button class="mode-btn" onclick="setMode('timeline')">Timeline</button>
      <button class="mode-btn" onclick="setMode('drama')">Drama</button>
      <button class="mode-btn" onclick="setMode('eli5')">ELI5</button>
      <button class="mode-btn" onclick="setMode('investor')">Investor</button>
      <div style="margin-top:10px;color:#888">
        Current mode: <span id="currentMode">summary</span>
      </div>
    </div>

    <div class="card">
      <button class="primary" onclick="cleanMess()">Clean This Mess</button>
    </div>

    <div class="card">
      <h3>Result</h3>
      <div id="output"></div>
    </div>

    <footer>
      Built ugly. Works great.
    </footer>
  </div>

  <!-- IMPORTANT: script goes LAST -->
  <script src="script.js"></script>
</body>
</html>
