<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SummifyAI</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .card {
      background: #141414;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
    }

    .input-box {
      width: 100%;
      min-height: 90px;
      background: #0f0f0f;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 12px;
      color: white;
      margin-bottom: 10px;
      resize: vertical;
    }

    button {
      background: #1e1e1e;
      border: none;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      margin-right: 6px;
    }

    button:hover {
      background: #2a2a2a;
    }

    .primary {
      background: #22c55e;
      color: black;
      font-weight: 600;
    }

    .primary:hover {
      background: #16a34a;
    }

    .mode-btn {
      margin-bottom: 6px;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Paste Chaos Here</h1>
    <div class="subtitle">
      Turn links, notes, tweets, screenshots, and mess into one clean page.
    </div>

    <!-- INPUTS -->
    <div class="card">
      <h3>Inputs</h3>
      <button onclick="addInput()">+ Add Input</button>
      <button onclick="clearInputs()">Clear</button>

      <div id="inputs"></div>
    </div>

    <!-- MODE -->
    <div class="card">
      <h3>Mode</h3>

      <button class="mode-btn" onclick="setMode('summary')">Summary</button>
      <button class="mode-btn" onclick="setMode('timeline')">Timeline</button>
      <button class="mode-btn" onclick="setMode('drama')">Drama</button>
      <button class="mode-btn" onclick="setMode('eli5')">ELI5</button>
      <button class="mode-btn" onclick="setMode('investor')">Investor</button>

      <p>Current mode: <strong id="currentMode">summary</strong></p>
    </div>

    <!-- ACTION -->
    <div class="card">
      <button class="primary" onclick="cleanMess()">Clean This Mess</button>
    </div>

    <!-- RESULT -->
    <div class="card">
      <h3>Result</h3>
      <div id="output"></div>
    </div>

    <div class="footer">
      Built ugly. Works great.
    </div>
  </div>

  <!-- SCRIPT -->
  <script src="script.js"></script>
</body>
</html>
